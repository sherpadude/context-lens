name: Issue Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-and-greet:
    name: Auto-label and Greet
    runs-on: ubuntu-latest
    steps:
      - name: Label bug reports
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const title = context.payload.issue.title || "";
            const labels = [];

            if (/bug|error|broken|crash|fail/i.test(title + body)) {
              labels.push("bug");
            }
            if (/feature|enhancement|add|improve|support/i.test(title + body)) {
              labels.push("enhancement");
            }
            if (/question|how|help|explain/i.test(title + body)) {
              labels.push("question");
            }
            if (/security|vulnerability|cve|exploit/i.test(title + body)) {
              labels.push("security");
            }
            if (/docs|documentation|readme/i.test(title + body)) {
              labels.push("documentation");
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }

      - name: Welcome new contributors on issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender.login;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: sender,
              state: "all",
            });

            if (issues.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `Thanks for opening your first issue, @${sender}! 🎉\n\nWe'll review this as soon as possible. In the meantime, please check [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) if you'd like to help fix it yourself.`,
              });
            }

      - name: Welcome new contributors on PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender.login;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
            });

            const authorPRs = prs.filter(pr => pr.user.login === sender);
            if (authorPRs.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `Thanks for your first PR, @${sender}! 🎉\n\nThe security gate will run automatically. Once all checks pass, a maintainer will review your changes.`,
              });
            }
