name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  security-triage:
    name: Security Issue Detection
    runs-on: ubuntu-latest
    steps:
      - name: Detect security keywords and notify
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const body  = context.payload.issue.body  || "";
            const text  = (title + " " + body).toLowerCase();

            const securityKeywords = [
              "security", "vulnerability", "cve", "exploit", "injection",
              "xss", "csrf", "rce", "sqli", "bypass", "leak", "exposure",
              "malicious", "attack", "payload", "overflow", "disclosure",
            ];

            const isSecurityReport = securityKeywords.some((kw) => text.includes(kw));

            if (isSecurityReport) {
              // Add security label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ["security"],
              });

              // Post standard security disclosure comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: [
                  "## Security Report Detected",
                  "",
                  "Thank you for your report. It appears this issue may describe a security concern.",
                  "",
                  "> **Please do not include exploit details, proof-of-concept code, or reproduction steps in this public issue.**",
                  "",
                  "ContextLens follows a responsible disclosure policy. If this is a vulnerability report, please:",
                  "",
                  "1. **Close this issue** and instead use [GitHub Private Vulnerability Reporting](../../security/advisories/new), or",
                  "2. Follow the steps in [SECURITY.md](../blob/main/SECURITY.md) to contact the maintainer privately.",
                  "",
                  "Public issues with exploit details may be closed and locked without further notice to protect users.",
                  "",
                  "If this is not a security vulnerability (just a general bug or question), you can ignore this message and continue — we'll review it soon.",
                ].join("\n"),
              });

              core.info("Security keyword detected — added 'security' label and posted SECURITY.md disclosure reminder.");
            } else {
              // Auto-label other issue types
              const labels = [];
              if (/bug|error|broken|crash|fail/i.test(title + body)) labels.push("bug");
              if (/feature|enhancement|add|improve|support/i.test(title + body)) labels.push("enhancement");
              if (/question|how|help|explain/i.test(title + body)) labels.push("question");
              if (/docs|documentation|readme/i.test(title + body)) labels.push("documentation");

              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels,
                });
                core.info(`Added labels: ${labels.join(", ")}`);
              }
            }
